<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무조건 오르는 루틴</title>
<meta name="theme-color" content="#1a2034">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 기본 리셋 */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: OMR 답안지 — 위에 고정된 안내 방송 띠, 답안 열 머리 같은 탭 줄, 괘선 종이 위 패널들 */
:root{
  --paper:#f4f5fa; --sheet:#ffffff; --ink:#1a2034; --muted:#5b6278; --line:#dde0ea;
  --omr:#cf3b54; --omr-soft:#fbe8eb; --omr-rule:#efc6cd; --blue:#2856cf; --blue-soft:#e6ecfb;
  --good:#1d8657; --good-soft:#e2f4ea; --warn:#b86e00; --warn-soft:#fbf0dc; --bad:#cf3b54;
  --shadow:0 1px 0 rgba(26,32,52,.06), 0 6px 20px -12px rgba(26,32,52,.25);
  --serif:"Gowun Batang","Noto Serif KR","AppleMyungjo","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141d; --sheet:#191d29; --ink:#e8eaf3; --muted:#9ba2b8; --line:#2b3041;
  --omr:#ff7088; --omr-soft:#3a1d27; --omr-rule:#4d2733; --blue:#86a6ff; --blue-soft:#1d2645;
  --good:#4fc68c; --good-soft:#163628; --warn:#f0a63a; --warn-soft:#3a2a10; --bad:#ff7088;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141d; --sheet:#191d29; --ink:#e8eaf3; --muted:#9ba2b8; --line:#2b3041;
  --omr:#ff7088; --omr-soft:#3a1d27; --omr-rule:#4d2733; --blue:#86a6ff; --blue-soft:#1d2645;
  --good:#4fc68c; --good-soft:#163628; --warn:#f0a63a; --warn-soft:#3a2a10; --bad:#ff7088;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.35rem} h3{font-size:1.08rem}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* 안내 방송 */
.notice{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--paper)}
.notice .wrap{display:flex;align-items:center;gap:12px;padding-block:9px;min-height:46px}
.notice .tag{flex:none;font-size:.72rem;letter-spacing:.12em;font-weight:700;background:var(--omr);color:#fff;padding:3px 8px;border-radius:3px}
.notice .msg{flex:1;min-width:0;font-weight:700;font-size:.98rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice .msg.flash{animation:flash 1.2s ease}
.notice .next{flex:none;font-size:.75rem;opacity:.7;font-family:var(--mono)}
.ddtop{flex:none;display:flex;gap:6px}
.ddtop span{display:inline-flex;align-items:baseline;gap:6px;border:1px solid rgba(255,255,255,.35);border-radius:5px;padding:2px 9px;font-size:.78rem;white-space:nowrap}
.ddtop b{font-family:var(--mono);color:var(--omr);font-size:.95rem}
.ddtop span+span{display:none}
@media (min-width:900px){.ddtop span+span{display:inline-flex}}
@keyframes flash{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}

header.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:18px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:1.7rem;letter-spacing:-.01em}
.brand h1 b{color:var(--omr)}
.brand small{color:var(--muted);font-size:.82rem}
.store-chip{font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--sheet)}
.store-chip.cloud{color:var(--good);border-color:var(--good)}

/* 탭: 답안지 열 머리 */
nav.tabs{border-bottom:2px solid var(--omr-rule)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;padding:10px 14px 9px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--omr);border-bottom-color:var(--omr);font-weight:700}
nav.tabs button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

main.wrap{padding-block:20px 80px;display:block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow);min-width:0}
.panel>h3{margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.section-head p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;color:var(--omr);font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)} .small{font-size:.84rem} .tiny{font-size:.75rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
hr.rule{border:0;border-top:1px dashed var(--omr-rule);margin:14px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:7px;padding:7px 13px;font-weight:500;cursor:pointer;font-size:.9rem;line-height:1.3;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.btn.primary{background:var(--omr);border-color:var(--omr);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn.lg{padding:12px 22px;font-size:1.02rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet);flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;font-size:.88rem;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}

input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px;line-height:1.6}
input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--sheet)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:500;min-width:0}
label.f>span{letter-spacing:.02em}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;border-radius:99px;padding:2px 9px;border:1px solid var(--line);background:var(--sheet);white-space:nowrap;cursor:default}
button.chip{cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.badge{font-size:.72rem;font-weight:700;border-radius:4px;padding:1px 7px;white-space:nowrap}
.badge.weak{background:var(--omr-soft);color:var(--bad)}
.badge.ok{background:var(--good-soft);color:var(--good)}
.badge.wait{background:var(--warn-soft);color:var(--warn)}
.badge.ex{background:var(--blue-soft);color:var(--blue)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:.74rem;color:var(--muted);font-weight:700;letter-spacing:.03em;background:var(--paper)}
table.t tr:last-child td{border-bottom:0}
table.t input{padding:4px 6px;text-align:right;min-width:62px}
table.t td:first-child input{text-align:left;min-width:110px}
.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--omr);color:var(--omr);font-weight:700;font-family:var(--mono);font-size:.82rem}

.drop{border:2px dashed var(--omr-rule);border-radius:10px;padding:18px;text-align:center;background:var(--paper);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--omr);background:var(--omr-soft)}
.drop strong{display:block;margin-bottom:2px}
.drop input{display:none}

.empty{border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--muted);font-size:.9rem}
.empty b{color:var(--ink)}

/* 홈 */
.dday{display:flex;gap:10px;flex-wrap:wrap}
.dday .d{border:2px solid var(--ink);border-radius:8px;padding:8px 14px;background:var(--sheet);min-width:0}
.dday .d b{font-family:var(--mono);font-size:1.6rem;color:var(--omr);display:block;line-height:1.1}
.dday .d span{font-size:.8rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:76px 1fr 64px;gap:8px;align-items:center;font-size:.84rem}
.bar .track{height:10px;background:var(--paper);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.bar .fill{height:100%;border-radius:5px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.big-stat{font-family:var(--mono);font-size:2rem;font-weight:600;line-height:1}

/* 플래너 */
.plan-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plan-nav h2{font-size:1.25rem;min-width:0}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:24px auto 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .txt{min-width:0;overflow-wrap:anywhere}
.item.done .txt{text-decoration:line-through;color:var(--muted)}
.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--omr)}
.item .meta{font-size:.76rem;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.add-row{display:grid;gap:8px;grid-template-columns:130px 1fr 90px 130px auto;align-items:end;margin-top:12px}
.progress{height:8px;background:var(--paper);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--omr)}

/* 타이머 */
.clock{font-family:var(--mono);font-weight:600;font-size:clamp(3rem,13vw,5.6rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-align:center;padding:10px 0}
.clock.sm{font-size:clamp(2rem,8vw,3rem)}
.timer-face{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.laps{max-height:180px;overflow:auto;width:100%;font-family:var(--mono);font-size:.86rem}
.laps div{display:flex;justify-content:space-between;padding:4px 6px;border-bottom:1px dashed var(--line)}
.segs{display:flex;flex-direction:column;gap:6px}
.seg-row{display:grid;grid-template-columns:1fr 92px 34px 34px;gap:6px;align-items:center}
.seg-row.cur{outline:2px solid var(--omr);border-radius:6px}
.seg-row .lock{border:1px solid var(--line);border-radius:6px;height:34px;background:var(--sheet);cursor:pointer;font-size:.8rem}
.seg-row .lock[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.periods{display:flex;flex-direction:column;gap:4px}
.period{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:8px 10px;border-radius:6px;align-items:center;font-size:.9rem;border:1px solid transparent}
.period.now{border-color:var(--omr);background:var(--omr-soft)}
.period.past{color:var(--muted);text-decoration:line-through}
.period.brk{font-size:.8rem;color:var(--muted);padding-block:3px}
.period .tm{font-family:var(--mono);font-size:.84rem}
.alarm{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.alarm b{font-family:var(--mono);font-size:1.3rem}
.switch{width:40px;height:22px;border-radius:99px;border:1px solid var(--line);background:var(--paper);position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.15s}
.switch[aria-pressed="true"]{background:var(--omr);border-color:var(--omr)}
.switch[aria-pressed="true"]::after{left:20px;background:#fff}

/* 오답 */
.note-card{display:flex;flex-direction:column;gap:8px}
.note-card .src{font-family:var(--serif);font-weight:700;font-size:1.02rem;overflow-wrap:anywhere}
.note-card .ex{font-size:.86rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--serif)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:6px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;overflow:hidden;font-size:.7rem;color:var(--muted);position:relative;text-align:center;padding:2px;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.slot{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--paper)}
.slot-files{display:flex;flex-direction:column;gap:6px}
.slot-file{display:grid;grid-template-columns:28px 48px 1fr auto;gap:8px;align-items:center;background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font-size:.84rem;min-width:0}
.slot-file .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-file .ord{font-family:var(--mono);color:var(--omr);font-weight:700;text-align:center}
.slot-file .thumb{width:48px;height:48px}
.qedit{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--sheet);display:flex;flex-direction:column;gap:8px}
.choices-edit{display:grid;grid-template-columns:24px 1fr 30px;gap:6px;align-items:center}
.choices-edit b{font-family:var(--serif);color:var(--omr)}
.reflect{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}

/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px))}
.modal[hidden]{display:none!important}
.sheet{background:var(--sheet);border-radius:12px;width:100%;max-width:880px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);display:flex;flex-direction:column;min-width:0}
.sheet.wide{max-width:1180px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:2px solid var(--omr-rule)}
.sheet-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.sheet-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}

/* 다시 풀기 */
.exam{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;min-height:60vh}
.exam .passage{padding:22px 24px;border-right:2px solid var(--ink);font-family:var(--serif);font-size:1.02rem;line-height:1.95;white-space:pre-wrap;overflow-wrap:anywhere;max-height:72vh;overflow:auto}
.exam .qside{padding:22px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.exam .stem{font-family:var(--serif);font-size:1.05rem;line-height:1.8;font-weight:700;white-space:pre-wrap;overflow-wrap:anywhere}
.exam .box{border:1px solid var(--ink);padding:12px 14px;font-family:var(--serif);white-space:pre-wrap;line-height:1.8;position:relative;margin-top:8px}
.exam .box::before{content:"〈보기〉";position:absolute;top:-.8em;left:50%;transform:translateX(-50%);background:var(--sheet);padding:0 8px;font-size:.85rem}
.opt{display:flex;gap:10px;text-align:left;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sheet);cursor:pointer;font-family:var(--serif);line-height:1.7;width:100%}
.opt:hover{border-color:var(--muted)}
.opt b{color:var(--omr);flex:none}
.opt.picked{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--omr-soft)}
.verdict{border-radius:8px;padding:12px 14px;font-weight:700}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--omr-soft);color:var(--bad)}
.explain{white-space:pre-wrap;font-size:.92rem;line-height:1.75;border-left:3px solid var(--line);padding-left:12px;overflow-wrap:anywhere}

/* 알림 */
.ring{position:fixed;inset:0;z-index:80;background:rgba(207,59,84,.94);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.ring[hidden]{display:none!important}
.ring h2{font-size:2rem;color:#fff}
.ring p{font-size:1.05rem;max-width:30ch;margin:0}
.ring button{background:#fff;color:#cf3b54;border:0;border-radius:99px;padding:14px 34px;font-weight:700;font-size:1.1rem;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;z-index:90;font-size:.9rem;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.toast[hidden]{display:none!important}
.busy{display:inline-flex;align-items:center;gap:8px;font-size:.85rem;color:var(--blue)}
.busy::before{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.viewer img{display:block;margin:0 auto 12px;max-width:100%;border:1px solid var(--line)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile b{display:block;font-family:var(--mono);font-size:1.35rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tile span{font-size:.78rem;color:var(--muted)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--blue-soft)}

function analyze(D, prog) {
  const t = today(); const days = [...Array(14)].map((_, i) => addDays(t, i - 13));
  const logBy = Object.fromEntries((D.logs || []).map(l => [l.date, l]));
  const net = days.map(d => logBy[d]?.net || 0);
  const subjDay = days.map(d => sumArr(Object.values(logBy[d]?.sec || {})));
  const w1 = sumArr(net.slice(7)), w0 = sumArr(net.slice(0, 7));
  const studyDays = net.slice(7).filter(v => v >= 600).length;
  const brk = {}; days.slice(7).forEach(d => Object.entries(logBy[d]?.netBreaks || {}).forEach(([k, v]) => brk[k] = (brk[k] || 0) + v));
  const brTot = sumArr(Object.values(brk));
  const sub30 = {}; (D.logs || []).filter(l => l.date >= addDays(t, -29)).forEach(l => Object.entries(l.sec || {}).forEach(([k, v]) => sub30[k] = (sub30[k] || 0) + v));
  let pt = 0, pd = 0; (D.plans || []).forEach(p => (p.items || []).forEach(it => { const d = p.period === 'day' ? p.start : it.date; if (d && d >= addDays(t, -6) && d <= t) { pt++; if (it.done) pd++; } }));
  const notes = D.notes || []; const wrongBy = {}, weakBy = {}; let at = 0, ao = 0;
  notes.forEach(n => { wrongBy[n.subject] = (wrongBy[n.subject] || 0) + (n.questions || []).length; (n.questions || []).forEach(q => { if (q.weak) weakBy[n.subject] = (weakBy[n.subject] || 0) + 1; (q.attempts || []).forEach(a => { at++; if (a.ok) ao++; }); }); });
  const weak = sumArr(Object.values(weakBy));
  const reviewDue = notes.filter(n => noteStatus(n) !== '극복' && (!n.lastTried || n.lastTried <= addDays(t, -7))).length;
  const mocks = (D.grades || []).filter(g => g.type === '모의고사').sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const avgRank = g => { const r = (g?.rows || []).map(x => +x.rank).filter(x => x > 0); return r.length ? sumArr(r) / r.length : null; };
  const lastM = mocks.at(-1) || null, prevM = mocks.at(-2) || null;
  const goals = (D.settings?.subjects || []).map(s => { if (!lastM || !s.goalMock) return null; const r = lastM.rows.find(x => x.subject === s.name); return r && +r.rank ? { subject: s.name, goal: +s.goalMock, now: +r.rank } : null; }).filter(Boolean);
  const books = (prog?.books || []).map(b => ({ ...b, pct: +b.total ? Math.min(100, Math.round((+b.done || 0) / +b.total * 100)) : 0 }));
  const lastProg = {}; (prog?.items || []).forEach(i => { if (!lastProg[i.subject] || i.date > lastProg[i.subject].date) lastProg[i.subject] = i; });

  const ins = [];
  const avg = w1 / 7;
  if (w1 || w0) { const ch = w0 ? Math.round((w1 - w0) / w0 * 100) : null; ins.push({ lv: w1 >= w0 ? 'ok' : 'wait', t: `최근 7일 순공부 ${fmtHM(w1)} (하루 평균 ${fmtHM(avg)})${ch == null ? '' : `, 그 전 7일보다 ${Math.abs(ch)}% ${ch >= 0 ? '늘었어요' : '줄었어요'}`}.` }); }
  else ins.push({ lv: 'weak', t: '최근 2주 동안 순공부 기록이 없어요. 순공부 타이머를 쓰는지 확인해 주세요.' });
  if (w1 && studyDays < 5) ins.push({ lv: 'wait', t: `최근 7일 중 10분 이상 공부한 날이 ${studyDays}일이에요. 공부하지 않는 요일이 있는지 살펴보세요.` });
  if (brTot && w1) { const r = Math.round(brTot / (w1 + brTot) * 100); const top = Object.entries(brk).sort((a, b) => b[1] - a[1])[0]; ins.push({ lv: r > 30 ? 'weak' : r > 18 ? 'wait' : 'ok', t: `공부 중 자리를 비운 시간 비율 ${r}% (가장 많은 이유: ${top[0]} ${fmtHM(top[1])}).` }); }
  { const np = D.settings?.netPlan || {}; const past = days.slice(7, 13).map((d, i) => ({ d, a: net[7 + i] / 60, p: +(np[parseYmd(d).getDay()] || 0) })).filter(x => x.p); if (past.length) { const met = past.filter(x => x.a >= x.p).length; const gap = Math.round(sumArr(past.map(x => x.a - x.p))); ins.push({ lv: met >= past.length * 0.8 ? 'ok' : met >= past.length / 2 ? 'wait' : 'weak', t: `요일별 순공부 계획 달성 ${met}/${past.length}일 (어제까지 6일), 합계 ${gap >= 0 ? '+' + fmtMin(gap) : '−' + fmtMin(-gap)}.` }); } }
  if (pt) { const r = Math.round(pd / pt * 100); ins.push({ lv: r >= 85 ? 'ok' : r >= 60 ? 'wait' : 'weak', t: `최근 7일 계획 달성률 ${r}% (${pd}/${pt}).${r < 60 ? ' 계획 양이 많거나 실행이 밀리고 있어요.' : ''}` }); }
  else ins.push({ lv: 'wait', t: '최근 7일 동안 플래너에 적은 할 일이 없어요.' });
  const subs = (D.settings?.subjects || []).map(s => s.name).filter(n => /국어|수학|영어/.test(n));
  if (Object.keys(sub30).length) { const low = subs.map(s => [s, sub30[s] || 0]).sort((a, b) => a[1] - b[1])[0]; if (low) ins.push({ lv: 'wait', t: `30일 동안 주요 과목 중 ${low[0]} 공부 시간이 가장 적어요 (${fmtHM(low[1])}).` }); }
  const wk = Object.entries(weakBy).sort((a, b) => b[1] - a[1])[0];
  if (wk) ins.push({ lv: 'weak', t: `약점 문제는 ${wk[0]}에 가장 많아요 (${wk[1]}문항).` });
  if (at) ins.push({ lv: ao / at >= 0.7 ? 'ok' : 'wait', t: `오답 다시 풀기 정답률 ${Math.round(ao / at * 100)}% (${ao}/${at}).` });
  if (reviewDue) ins.push({ lv: 'wait', t: `7일 넘게 다시 풀지 않은 오답노트가 ${reviewDue}개 있어요.` });
  if (lastM && prevM) { const a = avgRank(prevM), b = avgRank(lastM); if (a && b) ins.push({ lv: b <= a ? 'ok' : 'weak', t: `모의고사 평균 등급 ${a.toFixed(1)} → ${b.toFixed(1)} (${esc(prevM.title)} → ${esc(lastM.title)}).` }); }
  goals.filter(g => g.now > g.goal).forEach(g => ins.push({ lv: 'wait', t: `${g.subject}: 목표 ${g.goal}등급, 최근 ${g.now}등급으로 ${g.now - g.goal}등급 차이가 있어요.` }));
  books.filter(b => b.pct < 50 && b.total).forEach(b => ins.push({ lv: 'wait', t: `${b.subject} 진도 「${b.title}」 ${b.pct}% 진행.` }));
  return { days, net, subjDay, w1, w0, studyDays, brk, brTot, sub30, pt, pd, wrongBy, weakBy, weak, at, ao, reviewDue, lastM, prevM, avgRank, goals, books, lastProg, ins };
}
function dayBars(days, vals) {
  const W = 640, H = 200, L = 40, B = 30, T = 12; const max = Math.max(3600, ...vals); const bw = (W - L - 8) / days.length;
  const tickH = Math.ceil(max / 3600); let g = '';
  for (let h = 0; h <= tickH; h++) { const y = H - B - (H - B - T) * (h * 3600 / (tickH * 3600)); g += `<line x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${h}h</text>`; }
  vals.forEach((v, i) => { const h = (H - B - T) * v / (tickH * 3600); const x = L + i * bw + 3; g += `<rect x="${x}" y="${H - B - h}" width="${bw - 6}" height="${Math.max(0, h)}" rx="3" fill="${i === vals.length - 1 ? 'var(--omr)' : 'var(--blue)'}" opacity="${i < 7 ? .45 : 1}"/>`; const d = parseYmd(days[i]); g += `<text x="${x + (bw - 6) / 2}" y="${H - 10}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.getMonth() + 1}/${d.getDate()}</text>`; });
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 14일 순공부">${g}</svg></div>`;
}

  SXE = { id: uid(), title: res.find(r => r?.title)?.title || '', rows: mergeSxRows(res.flatMap(r => r?.rows || [])), notes: res.map(r => r?.notes).filter(Boolean).join('\n'), files: metas, _new: true };
  drawSxEditor();
}

/* ========== 모달 ========== */
function openModal(html) { const m = $('#modal'); m.innerHTML = html; m.hidden = false; document.body.style.overflow = 'hidden'; hydrate(m); }
function closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; document.body.style.overflow = ''; GE = null; NE = null; VE = null; RT = null; SE = null; SXE = null; EVE = null; }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal' && !NE && !RT && !GE && !VE && !SE) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden && !NE) closeModal(); });

async function viewFile(m) {
  openModal(`<div class="sheet wide"><div class="sheet-head"><h3 style="min-width:0;overflow-wrap:anywhere">${esc(m.name)}</h3><button class="btn ghost" data-act="close">닫기</button></div><div class="sheet-body viewer" id="viewer"><span class="busy">여는 중…</span></div></div>`);
  const box = $('#viewer');
  try {
    if (isImg(m)) { const u = await Files.url(m); box.innerHTML = u ? `<img src="${u}" alt="${esc(m.name)}">` : '<div class="empty">이 파일은 올린 기기에만 있어요.</div>'; }
    else if (isPdf(m)) { const b = await Files.blob(m); if (!b) throw 0; const pages = await pdfPages(b, 20, 1400); box.innerHTML = ''; pages.forEach(p => { const im = document.createElement('img'); im.src = URL.createObjectURL(p); im.alt = m.name; box.appendChild(im); }); }
    else if (isSheet(m)) { const b = await Files.blob(m); if (!b) { box.innerHTML = m.preview ? sheetPreviewHTML(m.preview) : '<div class="empty">이 파일은 올린 기기에만 있어요.</div>'; return; } const wb = await sheetRead(b); box.innerHTML = wb.SheetNames.slice(0, 5).map(n => `<h3>${esc(n)}</h3>` + sheetPreviewHTML(window.XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '' }).slice(0, 200))).join(''); }
    else box.innerHTML = '<div class="empty">미리 볼 수 없는 형식이에요.</div>';
  } catch { box.innerHTML = m.preview ? sheetPreviewHTML(m.preview) : '<div class="empty">파일을 열지 못했어요. 한셀 파일은 xlsx로 저장해 다시 올려 주세요.</div>'; }
}
function sheetPreviewHTML(rows) { return `<div class="tbl-wrap"><table class="t">${rows.map((r, i) => `<tr>${r.slice(0, 20).map(c => i ? `<td>${esc(c)}</td>` : `<th>${esc(c)}</th>`).join('')}</tr>`).join('')}</table></div>`; }

function setChip() { const c = $('#storeChip'); c.textContent = Store.mode === 'cloud' ? '계정에 저장 중' : '이 기기에 저장 중'; c.classList.toggle('cloud', Store.mode === 'cloud'); const si = $('#storeInfo'); if (si) si.textContent = storeInfo(); }
async function boot() {
  const h = (location.hash || '').slice(1); if (VIEWS[h] && h !== 'admin') UI.tab = h;
  const ok = await Local.open(); if (ok) apply(await loadAll(Local));
  Store.mode = 'local'; setChip(); go(UI.tab, 'replace');
  if (!window.claude?.use) return;
  try {
    const [db, user, assets] = await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('assets')]);
    Files.assets = assets || null;
    const id = user ? await user.id() : null;
    if (!db || !id) return;
    Cloud.db = db; Cloud.uid = id;
    const remote = await loadAll(Cloud);
    const remoteEmpty = KINDS.every(k => !remote[k].length) && !remote.settings;
    const localHas = KINDS.some(k => S[k].length);
    Store.mode = 'cloud';
    if (remoteEmpty && localHas) { for (const k of KINDS) for (const o of S[k]) await Cloud.put(k, o).catch(() => {}); await Cloud.put('meta', S.settings).catch(() => {}); toast('이 기기 기록을 계정으로 옮겼어요.'); }
    else apply(remote);
    ADM.user = user; try { ADM.on = !!(await user.canEdit()); } catch {}
    if (ADM.on) $('[data-tab="admin"]').hidden = false;
    myProgress = await loadProgress(id);
    try { db.doc('config/brand').onSnapshot(sn => { if (sn.exists && sn.data().tagline) { NOTICE.tagline = String(sn.data().tagline); applyTagline(); } }, () => {}); } catch {}
    try { db.doc('config/notice').onSnapshot(sn => { if (sn.exists) { const d = sn.data(); if (Array.isArray(d.messages) && d.messages.length) NOTICE.messages = d.messages.slice(); if (+d.every) NOTICE.every = +d.every; updateNotice(true); } }, () => {}); } catch {}
    setChip(); if ($('#modal').hidden) render(); pushRoster();
  } catch (e) { console.warn(e); Store.mode = 'local'; setChip(); }
}
boot();
})();
</script>
</body>
</html>
